const glyphs=[],pickables=[];
const tmpPlane=new THREE.Plane();
function makeGlyph(ch,opt={}){
  const D=glyphData(ch);
  const role=opt.role||'lime',scale=opt.scale||1;
  const group=new THREE.Group();group.scale.setScalar(scale);
  const n=opt.bands||(3+Math.floor(Math.random()*4));
  // cortes horizontales: como peldaños de una escalera
  const cuts=[0];for(let i=1;i<n;i++)cuts.push(D.H*(i/n+(Math.random()-.5)*.6/n));cuts.push(D.H+.01);
  cuts.sort((a,b)=>a-b);
  const bands=[];
  for(let i=0;i<n;i++){
    const lo=cuts[i]-.002,hi=cuts[i+1]+.002;
    const planes=[new THREE.Plane(new THREE.Vector3(0,1,0),-lo),new THREE.Plane(new THREE.Vector3(0,-1,0),hi)];
    const wplanes=planes.map(p=>p.clone());
    const face=reg(new THREE.MeshBasicMaterial({side:THREE.DoubleSide,clippingPlanes:wplanes}),role,'face');
    const side=reg(new THREE.MeshBasicMaterial({side:THREE.DoubleSide,clippingPlanes:wplanes}),role,'side');
    const m=new THREE.Mesh(D.geo,[face,side]);
    m.userData.glyph=group;pickables.push(m);group.add(m);
    const stair=opt.stair!=null?opt.stair:1;
    const k=(i-(n-1)/2);
    bands.push({m,planes,wplanes,
      base:new THREE.Vector2(k*.18*stair*(Math.random()*.8+.6),i*.25*stair*(Math.random()*.8+.4)),
      cur:new THREE.Vector2(),tgt:new THREE.Vector2(),phase:Math.random()*6});
  }
  // contorno intacto (la estructura) desplazado hacia abajo, como en el lettering
  if(opt.outline!==false){
    const omat=reg(new THREE.LineBasicMaterial({transparent:true,opacity:.95}),role,'outline');
    const og=new THREE.Group();
    D.contours.forEach(c=>og.add(new THREE.LineLoop(c,omat)));
    og.position.set(0,-.19,D.depth/2+.06);group.add(og);
  }
  group.userData={ch,role,bands,D,word:opt.word||'',hover:0,glow:0,retarget:Math.random()*3,spin:opt.spin||null};
  glyphs.push(group);
  return group;
}
function advance(ch){const g=GLYPHS[ch];return (g.x1-g.x0+16)*S;}
function placeWord(text,{angle,radius,y=0,scale=1,role='lime',stair=1,tilt=0}){
  const word=new THREE.Group();
  let w=0;[...text].forEach(c=>w+=advance(c));w-=16*S;
  let x=-w/2;
  [...text].forEach(c=>{
    const g=makeGlyph(c,{role,scale:1,word:text,stair});
    const a=advance(c);g.position.x=x+(a-16*S)/2;x+=a;word.add(g);
  });
  word.scale.setScalar(scale);
  word.position.set(Math.sin(angle)*radius,y,Math.cos(angle)*radius);
  scene.add(word);word.lookAt(0,y,0);word.rotateZ(tilt);
  return word;
}

// ---------- Loop ----------
const clock=new THREE.Clock(),fwd=new THREE.Vector3(),right=new THREE.Vector3();
const deg=document.getElementById('deg'),dir=document.getElementById('dir');const DIRS=['N','NO','O','SO','S','SE','E','NE'];
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(touring){
    tourT+=dt*.075;
    const r=11+Math.sin(tourT*2)*5;
    camera.position.set(Math.sin(tourT)*r,2+Math.max(0,Math.sin(tourT*1.5))*5,Math.cos(tourT)*r);
    tYaw=tourT-Math.PI/2-.7+Math.sin(tourT*1.3)*.35;tPitch=.1+Math.sin(tourT*2.1)*.18;
    while(tYaw-yaw>Math.PI)tYaw-=Math.PI*2;while(tYaw-yaw<-Math.PI)tYaw+=Math.PI*2;
  }else{
    const sp=(keys.shift?14:7)*dt;
    fwd.set(-Math.sin(yaw),0,-Math.cos(yaw));right.set(Math.cos(yaw),0,-Math.sin(yaw));
    if(keys.w||keys.arrowup)camera.position.addScaledVector(fwd,sp);
    if(keys.s||keys.arrowdown)camera.position.addScaledVector(fwd,-sp);
    if(keys.a||keys.arrowleft)camera.position.addScaledVector(right,-sp);
    if(keys.d||keys.arrowright)camera.position.addScaledVector(right,sp);
    const hr=Math.hypot(camera.position.x,camera.position.z);if(hr>70){camera.position.x*=70/hr;camera.position.z*=70/hr;}
    if(performance.now()-lastInput>9000)tYaw+=dt*.04;
  }
  yaw+=(tYaw-yaw)*Math.min(1,dt*6);pitch+=(tPitch-pitch)*Math.min(1,dt*6);
  camera.rotation.set(pitch,yaw,0);
  fov+=(tFov-fov)*Math.min(1,dt*6);if(Math.abs(camera.fov-fov)>.01){camera.fov=fov;camera.updateProjectionMatrix();}

  // fragmentación: las franjas se desplazan como peldaños y se reacomodan
  glyphs.forEach(g=>{
    const u=g.userData;
    if(u.spin){g.rotation.x+=u.spin.x*dt;g.rotation.y+=u.spin.y*dt;g.rotation.z+=u.spin.z*dt;g.position.y=u.baseY+Math.sin(t*.5+u.phase)*.7;}
    u.hover+=(((g===hovered||g===selected)?1:0)-u.hover)*Math.min(1,dt*6);
    u.retarget-=dt;
    const jump=u.retarget<0;if(jump)u.retarget=2+Math.random()*5;
    const amp=frag*1.6+u.hover*1.2;
    u.bands.forEach((b,i)=>{
      if(jump){b.tgt.set((Math.random()-.5)*.5,(Math.random()-.5)*.3);}
      const wob=.65+.35*Math.sin(t*.7+b.phase);
      const tx=(b.base.x*wob+b.tgt.x)*amp,tz=(b.base.y*wob+b.tgt.y*.5)*amp;
      b.cur.x+=(tx-b.cur.x)*Math.min(1,dt*4);b.cur.y+=(tz-b.cur.y)*Math.min(1,dt*4);
      b.m.position.set(b.cur.x,0,b.cur.y);
    });
  });
  scene.updateMatrixWorld();
  glyphs.forEach(g=>g.userData.bands.forEach(b=>{b.wplanes[0].copy(b.planes[0]).applyMatrix4(b.m.matrixWorld);b.wplanes[1].copy(b.planes[1]).applyMatrix4(b.m.matrixWorld);}));

  bits.forEach(b=>{b.p.x+=b.v*dt;if(Math.abs(b.p.x)>70)b.p.x*=-.98;dummy.position.copy(b.p);dummy.rotation.set(0,b.ry,0);dummy.scale.copy(b.s);dummy.updateMatrix();b.im.setMatrixAt(b.i,dummy.matrix);});
  bits.forEach(b=>b.im.instanceMatrix.needsUpdate=true);

  const d=((-yaw*180/Math.PI)%360+360)%360;
  deg.textContent=String(Math.round(d)).padStart(3,'0')+'°';dir.textContent=DIRS[Math.round(((360-d)%360)/45)%8];
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const ready=document.fonts&&document.fonts.load?Promise.all([document.fonts.load("500 54px 'IBM Plex Mono', monospace"),document.fonts.load("700 44px 'IBM Plex Mono', monospace"),document.fonts.load("400 40px 'IBM Plex Mono', monospace")]):Promise.resolve();
const go=()=>{buildPanels();applyTheme('negro');const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),700);};
ready.then(go,go);
loop();
})();
</script>
</body>
